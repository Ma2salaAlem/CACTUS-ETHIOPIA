<script src="assets/portfolio-data.js"></script>
<script>
  (function renderProject(){
    var mount = document.getElementById('projectContent');
    if (!mount) return;

    var params = new URLSearchParams(window.location.search);
    var id = params.get('id');
    var item = (window.PORTFOLIO || []).find(function(p){ return p.slug === id; });

    var FALLBACK_IMG = 'https://images.unsplash.com/photo-1557804506-669a67965ba0?auto=format&fit=crop&w=1600&q=80';

    if (!item) {
      mount.innerHTML =
        '<section class="section" style="padding-top:172px;">' +
          '<div class="container" style="text-align:center;">' +
            '<p class="eyebrow" style="justify-content:center;">Case Study</p>' +
            '<h1 style="font-size:clamp(28px,4vw,44px); margin-bottom:16px;">Project not found</h1>' +
            '<p style="color:var(--text-muted); margin-bottom:32px;">We couldn\u2019t find a case study matching that link.</p>' +
            '<a href="work.html" class="btn btn-primary">Back to Work</a>' +
          '</div>' +
        '</section>';
      return;
    }

    document.getElementById('pageTitle').textContent = item.title.charAt(0) + item.title.slice(1).toLowerCase() + ' — Cactus Ethiopia';

    var metaParts = [];
    metaParts.push('<span><b>CLIENT:</b> ' + item.client + '</span>');
    if (item.brand) metaParts.push('<span><b>BRAND:</b> ' + item.brand + '</span>');
    metaParts.push('<span><b>CATEGORY:</b> ' + item.category + '</span>');
    metaParts.push('<span><b>MARKET:</b> ' + item.market + '</span>');
    metaParts.push('<span><b>FIELDS:</b> ' + item.fields.join(', ') + '</span>');

    var paragraphs = item.desc.map(function(p){ return '<p>' + p + '</p>'; }).join('');

    var otherProjects = window.PORTFOLIO.filter(function(p){ return p.slug !== item.slug; });
    // simple deterministic pick of 3 "more work" links
    var more = otherProjects.slice(0, 3).map(function(p){
      return '<a class="more-link" href="project.html?id=' + p.slug + '">' +
        '<span class="more-link-title">&ldquo;' + p.title + '&rdquo;</span>' +
        '<span class="more-link-client">' + p.client + '</span>' +
      '</a>';
    }).join('');

    mount.innerHTML =
      '<section class="project-hero">' +
        '<div class="container">' +
          '<p class="breadcrumb"><a href="index.html">Home</a> <span>/</span> <a href="work.html">Work</a> <span>/</span> <span>' + item.title.charAt(0) + item.title.slice(1).toLowerCase() + '</span></p>' +
          '<h1 class="project-title">' + item.title + '</h1>' +
          '<p class="project-meta">' + metaParts.join('<span class="meta-sep">&middot;</span>') + '</p>' +
          '<div class="project-desc">' + paragraphs + '</div>' +
        '</div>' +
      '</section>' +

      '<section class="project-media">' +
        '<img src="' + item.image + '" alt="' + item.title + ' campaign visual — ' + item.client + '" ' +
          'onerror="this.onerror=null; this.src=\'' + FALLBACK_IMG + '\';">' +
      '</section>' +

      '<section class="section" id="more-work">' +
        '<div class="container">' +
          '<div class="section-head reveal">' +
            '<div>' +
              '<p class="eyebrow">Keep Exploring</p>' +
              '<h2>More case studies.</h2>' +
            '</div>' +
            '<a href="work.html" class="btn btn-outline">View All Work</a>' +
          '</div>' +
          '<div class="more-grid">' + more + '</div>' +
        '</div>' +
      '</section>';
  })();
</script>
<script src="assets/main.js"></script>
</body>
